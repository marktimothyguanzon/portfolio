<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contact — Mark Timothy Guanzon</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Mark Timothy Guanzon</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="resume.html">Resume</a></li>
          <li class="nav-item ms-3"><button class="btn btn-outline-light" id="toggleDark">Dark Mode</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="pt-5">
      <h1>Contact</h1>
      <p>If you'd like to reach out about collaborations, projects, or opportunities, you can contact me using this form (demo only) or via email.</p>

      <form id="contactForm" class="row g-3" onsubmit="return false;">
        <div class="col-md-6">
          <label class="form-label">Name</label>
          <input class="form-control" id="name" placeholder="Your name">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input class="form-control" id="email" placeholder="you@example.com">
        </div>
        <div class="col-12">
          <label class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="5" placeholder="Write your message..."></textarea>
        </div>
        <div class="col-12 text-end">
          <button class="btn btn-primary" id="sendBtn">Send Message</button>
        </div>
      </form>

      <div id="contactAlert" class="alert mt-3 d-none" role="alert"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container text-center py-3">
      <p class="mb-0">© 2025 Mark Timothy Guanzon. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
